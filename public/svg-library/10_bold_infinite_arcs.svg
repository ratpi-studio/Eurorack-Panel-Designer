<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <title>Bold Infinite Arcs</title>
  <desc>Seamless black and white arc network using thick rounded strokes and wide negative spaces.</desc>
  <defs>
    <pattern id="tile" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
        <path d="M0 90 C45 90 45 45 90 45 C135 45 135 90 180 90"/>
        <path d="M0 90 C45 90 45 135 90 135 C135 135 135 90 180 90"/>
        <path d="M90 0 C90 45 45 45 45 90 C45 135 90 135 90 180"/>
        <path d="M90 0 C90 45 135 45 135 90 C135 135 90 135 90 180"/>
        <circle cx="90" cy="90" r="18" fill="#000" stroke="none"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#tile)"/>
</svg>
